<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thư viện nhạc lý</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/shell.css">
</head>
<body data-page="library" data-root="">
  <div class="backdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <button class="btn ghost small" id="menu-toggle" type="button" aria-label="Mở mục lục">☰</button>
        <span class="crumb">Thư viện</span>
        <button class="btn small" id="theme-toggle" type="button"><span class="theme-label">Sáng</span></button>
      </header>

      <div class="dash">
        <div class="hero">
          <div class="hero-top">
            <div>
              <div class="eyebrow">Music Library <span>· học offline</span></div>
              <h1>Thư viện nhạc lý</h1>
              <p class="lead">Mỗi cuốn sách là một khóa học nhỏ: ghi chú, quiz, flashcard và ôn tập ngắt quãng.
                Mở trên điện thoại, cài vào màn hình chính và học cả khi không có mạng.</p>
            </div>
          </div>
        </div>

        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
          </svg>
          <input id="book-search" type="search" placeholder="Tìm sách hoặc tác giả...">
        </div>

        <div class="book-grid" id="book-grid"></div>

        <p class="install-hint" id="install-hint" hidden></p>

        <footer class="library-foot">
          <span>Sách hiện có: <strong id="book-count">1</strong></span>
        </footer>
      </div>
    </div>
  </div>

  <script src="assets/data/library.js"></script>
  <script src="assets/shell.js"></script>
  <script src="assets/pwa.js"></script>
</body>
</html>
