<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chuyển trang…</title>
  <style>
    body { margin: 0; padding: 32px 20px; background: #0e1014; color: #e8ebf1; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; line-height: 1.6; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 0 0 12px; letter-spacing: -0.02em; }
    p { color: #99a3b3; }
    .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    a { display: inline-block; padding: 10px 14px; border-radius: 10px; border: 1px solid #262d38; background: #171b22; color: #e8ebf1; text-decoration: none; font-size: 14px; }
    a.primary { background: #f0b429; border-color: #f0b429; color: #1a1205; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Trang đã chuyển</h1>
    <p>Website đã đổi sang cấu trúc thư viện nhiều sách. Nếu không tự chuyển, chọn liên kết bên dưới.</p>
    <p id="target"></p>
    <div class="links">
      <a class="primary" href="./">Thư viện</a>
      <a href="./music-theory-for-guitarists-kolb/">Sách guitar</a>
      <a href="./music-theory-for-guitarists-kolb/chapters/ch01-fretboard.html">Chương 1</a>
    </div>
  </main>
  <script>
    (function () {
      const BOOK = "/music-theory-for-guitarists-kolb/";
      const path = window.location.pathname;
      const suffix = window.location.search + window.location.hash;
      let next = "";

      if (path.indexOf(BOOK) !== -1) return;

      const chapterMatch = path.match(/\/chapters\/([^/]+\.html)$/);
      if (chapterMatch) {
        next = path.replace(/\/chapters\/[^/]+\.html$/, BOOK + "chapters/" + chapterMatch[1]);
      } else if (/\/glossary\.html$/.test(path)) {
        next = path.replace(/\/glossary\.html$/, BOOK + "glossary.html");
      } else if (/\/index\.html$/.test(path)) {
        next = path.replace(/\/index\.html$/, "/");
      }

      if (next) {
        document.getElementById("target").textContent = "Đang chuyển tới " + next;
        window.location.replace(next + suffix);
      }
    })();
  </script>
</body>
</html>
